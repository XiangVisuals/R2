name = "xiang-r2-vault"
pages_build_output_dir = "public"
compatibility_date = "2024-09-23"

# 绑定您的 Cloudflare R2 存储桶
# 请将 bucket_name 修改为您在 Cloudflare R2 中创建的实际存储桶名称
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "xiang-visuals-r2"

[vars]
# 可选：如果您为 R2 存储桶绑定了自定义公开域名（例如 https://r2.xiangvisuals.com），请填写在下方
# 留空则默认使用当前站点同源高速 CDN 代理路由 (/raw/...)，同样享受 Cloudflare 全球边缘缓存加速
PUBLIC_R2_DOMAIN = ""
